<div class="card stack" id="un"><h1 style="font-size:2rem">Stop follow-up emails?</h1>
<p class="muted">You'll stop receiving follow-ups and updates. Messages about things you booked (sessions, cohorts, visits) still arrive.</p>
<button class="btn" id="go" type="button">Unsubscribe me</button><div class="msg" id="u-msg" aria-live="polite"></div></div>
</div></main>
<footer class="foot"><div class="wrap"><span>© Imani Green · <span data-bind="brand">How Bad Do You Want It?</span></span><span><a href="privacy">Privacy</a></span></div></footer>
<script type="module">
import { $, $$, fmt, fmtDate, fmtTime, tzName, viewerTz, esc, formData, busy, say, params, header, BLOOM_SVG } from './js/common.js';
import { api, track, demoBar, DEMO, amazonHref, loadSite } from './js/api.js';
demoBar(); header(); $$('[data-bloom]').forEach((el) => (el.outerHTML = BLOOM_SVG)); loadSite();

$('#go').onclick = async (e) => {
  busy(e.currentTarget, true, 'Updating…');
  try { await api('unsubscribe', { method: 'POST', body: { t: params.get('t') } }); $('#un').innerHTML = '<h1 style="font-size:2rem">Done</h1><p>You have been unsubscribed from follow-ups.</p>'; }
  catch (err) { busy(e.currentTarget, false); say($('#u-msg'), err.message); }
};

</script>
