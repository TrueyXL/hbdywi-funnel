# Tiny scheduled Worker: Pages has no cron, so this pings /api/cron/tick every 5 minutes.
# Deploy:  cd cron-worker && npx wrangler deploy && npx wrangler secret put CRON_SECRET
name = "hbdywi-cron"
main = "index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://{{DOMAIN}}"
