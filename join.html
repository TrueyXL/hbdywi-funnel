<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join an Accountability Circle · How Bad Do You Want It?</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,0..100;1,9..144,400..600,0..100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 14c-2.6-1.8-3.4-5-2-8.5 1.2.6 2 1.4 2 1.4s.8-.8 2-1.4c1.4 3.5.6 6.7-2 8.5Z' fill='%23b4566e'/%3E%3Cpath d='M16 29V15' stroke='%232f3a2f' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="wrap"><a class="brand" href="./"><span data-bloom></span><span data-bind="brand">How Bad Do You Want It?</span></a><a class="btn sm ghost" href="./">Home</a></div></header>
<main id="main" class="page"><div class="wrap narrow">

<div id="jn"><p class="muted">Loading invitation…</p></div>
</div></main>
<footer class="foot"><div class="wrap"><span>© Imani Green · <span data-bind="brand">How Bad Do You Want It?</span></span><span><a href="privacy">Privacy</a></span></div></footer>
<script type="module">
import { $, $$, fmt, fmtDate, fmtTime, tzName, viewerTz, esc, formData, busy, say, params, header, BLOOM_SVG } from './js/common.js';
import { api, track, demoBar, DEMO, amazonHref, loadSite } from './js/api.js';
demoBar(); header(); $$('[data-bloom]').forEach((el) => (el.outerHTML = BLOOM_SVG)); loadSite();

const code = (params.get('c') || (location.pathname.match(/\/j\/([A-Za-z0-9]+)/) || [])[1] || '').toUpperCase();
track('page_view');
async function load() {
  const box = $('#jn');
  let g; try { g = await api('join/' + code); } catch { box.innerHTML = '<h1>Invite not found</h1><p class="muted">Ask your group leader to resend the link.</p>'; return; }
  const when = [g.meeting_day, g.meeting_time && new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' }).format(new Date('2000-01-01T' + g.meeting_time + ':00Z')), g.frequency && g.frequency.toLowerCase()].filter(Boolean).join(' · ');
  box.innerHTML = `
    <span class="eyebrow">You're invited to an Accountability Circle</span>
    <h1 style="font-size:clamp(2rem,6vw,3.2rem)">Join ${esc(g.name)}</h1>
    <p class="lede">${g.leader_first_name ? esc(g.leader_first_name) + ' invited you to grow through <b>How Bad Do You Want It?</b> together.' : 'Grow through <b>How Bad Do You Want It?</b> together.'}${when ? `<br><span class="small muted">${esc(when)}${g.timezone ? ' (' + esc(g.timezone.replace(/_/g, ' ')) + ')' : ''}</span>` : ''}</p>
    <form class="card" id="j-form" style="margin-top:24px" novalidate>
      <div class="row two">
        <div class="field"><label for="j-first">First name</label><input id="j-first" name="first_name" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="j-last">Last name</label><input id="j-last" name="last_name" type="text" autocomplete="family-name" required></div>
      </div>
      <div class="field"><label for="j-email">Email</label><input id="j-email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="j-vol">Which volume have you purchased?</label><select id="j-vol" name="purchased_volume" required><option value="">Choose…</option>${(g.volumes || ['Volume One']).map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}<option value="none">Not yet</option></select></div>
      <div class="field"><label class="check"><input type="checkbox" name="opt_in"> <span>Also send me updates about the book, cohorts and ${esc(g.updates_list_name || 'How Bad Do You Want It?')}. <span class="muted">(optional, joining the circle never subscribes you)</span></span></label></div>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn bloom block" type="submit">Join the circle</button>
      <div class="msg" id="j-msg" aria-live="polite"></div>
    </form>`;
  $('#j-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.currentTarget, btn = f.querySelector('button[type=submit]'), msg = $('#j-msg'), d = formData(f);
    if (!d.first_name?.trim() || !d.last_name?.trim() || !f.email.checkValidity()) return say(msg, 'Please enter your first name, last name and a valid email.');
    if (!d.purchased_volume) return say(msg, 'Please tell us which volume you have purchased (or choose "Not yet").');
    busy(btn, true, 'Joining…'); say(msg, '');
    try {
      const r = await api('join/' + code, { method: 'POST', body: d });
      f.outerHTML = `<div class="card center stack" style="margin-top:24px" role="status"><div style="font-size:2.4rem">🌸</div>
        <h2>${r.already_member ? "You're already in. We've updated your details." : "You're in!"}</h2>
        <p>Welcome to <b>${esc(r.group_name)}</b>. A confirmation is on its way to <b>${esc(d.email)}</b>.</p>
        ${r.purchased ? '' : `<p>Grab your copy before the first meeting:</p><p><a class="btn" target="_blank" rel="noopener" href="${amazonHref('paperback', 'join')}">Get Volume One on Amazon</a></p>`}
        <p class="small muted">${r.member_count} ${r.member_count === 1 ? 'person has' : 'people have'} joined so far.</p></div>`;
    } catch (err) { busy(btn, false); say(msg, err.message); }
  });
}
load();

</script>
</body>
</html>
