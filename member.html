<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,0..100;1,9..144,400..600,0..100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 14c-2.6-1.8-3.4-5-2-8.5 1.2.6 2 1.4 2 1.4s.8-.8 2-1.4c1.4 3.5.6 6.7-2 8.5Z' fill='%23b4566e'/%3E%3Cpath d='M16 29V15' stroke='%232f3a2f' stroke-width='2'/%3E%3C/svg%3E">

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="wrap"><a class="brand" href="./"><span data-bloom></span><span>The Bloom Project</span></a><a class="btn sm ghost" href="./">Home</a></div></header>
<main id="main" class="page"><div class="wrap narrow">

<div id="mb"><p class="muted">Loading…</p></div>
</div></main>
<footer class="foot"><div class="wrap"><span>© Imani Green · The Bloom Project</span><span><a href="privacy">Privacy</a></span></div></footer>
<script type="module">
import { $, $$, fmt, fmtDate, fmtTime, tzName, viewerTz, esc, formData, busy, say, params, header, BLOOM_SVG } from './js/common.js';
import { api, track, demoBar, DEMO, amazonHref } from './js/api.js';
demoBar(); header(); $$('[data-bloom]').forEach((el) => (el.outerHTML = BLOOM_SVG));

const t = params.get('t');
async function load() {
  const box = $('#mb');
  let m; try { m = await api('member/' + t); } catch { box.innerHTML = '<h1>Link not found</h1><p class="muted">Use the link from your confirmation email.</p>'; return; }
  box.innerHTML = `<span class="eyebrow">${esc(m.group_name)}</span><h1 style="font-size:clamp(2rem,6vw,3rem)">Hi ${esc(m.first_name)}</h1>
    <form class="card" id="m-form" novalidate>
      <fieldset><legend>Have you purchased Volume One?</legend>
        <div class="seg"><label><input type="radio" name="purchased" value="yes" ${m.purchased ? 'checked' : ''}><span>Yes</span></label><label><input type="radio" name="purchased" value="no" ${m.purchased ? '' : 'checked'}><span>Not yet</span></label></div></fieldset>
      <div class="field"><label class="check"><input type="checkbox" name="opt_in" ${m.opt_in ? 'checked' : ''}> <span>Send me updates about the book, cohorts and The Bloom Project.</span></label></div>
      <button class="btn block" type="submit">Save</button><div class="msg" id="m-msg" aria-live="polite"></div></form>`;
  $('#m-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const d = formData(e.currentTarget);
    try { await api('member/' + t, { method: 'POST', body: d }); say($('#m-msg'), 'Saved ✓', 'ok'); } catch (err) { say($('#m-msg'), err.message); }
  });
}
load();

</script>
</body>
</html>
